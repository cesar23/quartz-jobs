# .github/workflows/promote_prod.yml
# =============================================================================
# WORKFLOW: Promote to PROD and Deploy (SELF-HOSTED)
# =============================================================================
# Se dispara A MANO, indicando el SHA ya validado en PRE y una versión
# semántica (ej. v1.4.2). Requiere aprobación manual vía el GitHub
# Environment "production" (Settings → Environments → production →
# Required reviewers). NOTA: en repos privados con GitHub Free, "Required
# reviewers" no está disponible — el gate real de aprobación es que este
# workflow solo se dispara manualmente vía workflow_dispatch.
#
# El job "deploy" corre directamente en el runner self-hosted instalado en
# el propio VPS (usuario gha-runner, miembro del grupo docker) -- por eso
# los comandos son "run:" directos y las URLs de healthcheck usan
# "localhost" (antes usaban VPS_HOST por error, quedó desincronizado de
# promote_pre.yml cuando se migró de SSH a self-hosted runner).
#
# Requiere en el VPS la carpeta /opt/app_prod con:
#   docker-compose.yml   (el mismo del repo -- SIN overlay por ambiente,
#                          las diferencias por ambiente ya las resuelve
#                          --env-file, ver docker-compose.yml)
#   .env.prod
# =============================================================================

name: Promote to PROD and Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA corto ya validado en PRE (ej. a1b2c3d)"
        required: true
      version:
        description: "Versión semántica (ej. v1.4.2)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_TOKEN_PAT: ${{ secrets.TOKEN_GITHUB }}
  #VPS_HOST: ${{ vars.VPS_HOST }}

jobs:
  promote:
    runs-on: ubuntu-latest
    name: Retag pre -> prod
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GITHUB_TOKEN_PAT }}

      - name: Retag pre-<sha> como prod (mismo digest, sin rebuild)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pre-${{ github.event.inputs.sha }}


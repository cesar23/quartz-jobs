# .github/workflows/promote_pre.yml
# =============================================================================
# WORKFLOW: Promote to PRE and Deploy
# =============================================================================
# Se dispara A MANO desde Actions -> Run workflow, indicando el SHA corto de
# la imagen "dev-<sha>" que build.yml ya construyo y publico.
#
# NO reconstruye nada: "docker buildx imagetools create" copia el
# manifiesto/digest de "dev-<sha>" hacia "pre" (y "pre-<sha>" para
# trazabilidad). Es un simple re-etiquetado en el registry.
#
# El job "deploy" corre directamente en el runner self-hosted instalado en
# el propio VPS (usuario gha-runner, miembro del grupo docker) -- por eso
# los comandos son "run:" directos y las URLs de healthcheck usan
# "localhost" en vez de VPS_HOST.
#
# Requiere en el VPS la carpeta /opt/app_pre con:
#   docker-compose.yml   (el mismo del repo -- SIN overlay por ambiente,
#                          las diferencias por ambiente ya las resuelve
#                          --env-file, ver docker-compose.yml)
#   .env.pre
# =============================================================================

name: Promote to PRE and Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA corto de la imagen dev a promover (ej. a1b2c3d, visible en los logs de build.yml)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_TOKEN_PAT: ${{ secrets.TOKEN_GITHUB }}
  #VPS_HOST: ${{ vars.VPS_HOST }}

jobs:
  promote:
    runs-on: ubuntu-latest
    name: Retag dev -> pre
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GITHUB_TOKEN_PAT }}

      - name: Retag dev-<sha> como pre (sin rebuild, mismo digest)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pre \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pre-${{ github.event.inputs.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.event.inputs.sha }}


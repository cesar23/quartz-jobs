# ============================================================
#  Perfil "prod": MySQL, credenciales SOLO por variables de entorno
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quartzjobs}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false

  h2:
    console:
      enabled: false

logging:
  level:
    com.quartzjobs: INFO
    org.hibernate.SQL: WARN
